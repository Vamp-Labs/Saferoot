services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saferoot
      POSTGRES_PASSWORD: saferoot
      POSTGRES_DB: saferoot
    ports:
      - "5432:5432"
    volumes:
      - saferoot-postgres-data:/var/lib/postgresql/data

volumes:
  saferoot-postgres-data:
